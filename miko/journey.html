.jmap .sub{font-size:12px;fill:#8A7A6C}

<h1 class="subh">One student. Three doors.<br>One system behind her.</h1>
<p class="sublead">How a stylist finds Miko today — and what each layer adds as the system grows.</p>

<svg class="jmap" viewBox="0 0 960 600" role="img" aria-labelledby="jt jdesc">

</g>
<g class="jfade" style="animation-delay:2.9s">
