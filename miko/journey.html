<script src="assets/vendor/vivus/vivus.min.js"></script>
<script>
(function(){
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STEPS = [
    {ids:['SA'], draw:'laneA', title:'The chair is the door.',
      lead:'A client asks — Miko mentions the workshop — she attends. Then the path ends. No follow-up exists.'},
    {ids:['SB'], draw:'laneB', title:'Word of mouth is the only engine.',
      lead:'An attendee tells a friend. If the friend can find her — same path, same ending.'},
    {ids:['SC'], draw:'laneC', title:'+ A website makes her findable.',
      lead:'A stranger searches, takes the score, sees her stage — and arrives warm, day or night.'},
    {ids:['SD'], draw:'laneD', title:'+ The course keeps her.',
      lead:'The workshop stops being the end — it becomes the on-ramp. The third income stream.'},
    {ids:['SE'], title:'+ The CRM remembers everyone.',
      lead:'Every student on every path is known — and graduates bring friends back to any door.'},
  ];
  var step = -1, viv = {};
  var title = document.getElementById('jtitle');
  var lead = document.getElementById('jlead');
  var ind = document.getElementById('jstep');

  function apply(i){
    STEPS.slice(0, i+1).forEach(function(s){
      s.ids.forEach(function(id){ document.getElementById(id).classList.add('on'); });
      if(s.draw && window.Vivus && !reduced && !viv[s.draw]){
        viv[s.draw] = new Vivus(s.draw,{duration:80,type:'scenario',animTimingFunction:Vivus.EASE});
      }
    });
    var s = STEPS[i];
    title.textContent = s.title; lead.textContent = s.lead;
    ind.innerHTML = '<b>' + (i+1) + ' / ' + STEPS.length + '</b> — ' +
      (i+1 < STEPS.length ? 'space or tap → next path' : 'the whole picture');
  }
  function unapply(i){
    var s = STEPS[i];
    s.ids.forEach(function(id){ document.getElementById(id).classList.remove('on'); });
    var p = STEPS[i-1];
    title.textContent = p.title; lead.textContent = p.lead;
    ind.innerHTML = '<b>' + i + ' / ' + STEPS.length + '</b> — space or tap → next path';
  }
  function next(){ if(step < STEPS.length-1){ step++; apply(step); } }
  function prev(){ if(step > 0){ unapply(step); step--; } }
  if(reduced){ step = STEPS.length-1; apply(step); return; }
  document.addEventListener('keydown', function(e){
    if(e.code==='Space'||e.code==='ArrowRight'){ e.preventDefault(); next(); }
    if(e.code==='ArrowLeft'){ e.preventDefault(); prev(); }
  });
  document.querySelector('.jmap').addEventListener('click', next);
  next();
})();
</script>
