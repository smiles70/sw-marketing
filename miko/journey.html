.jstep{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#8A7A6C;margin-top:14px}
.jstep b{color:#9C5530;font-weight:700}
.jback{display:inline-flex;align-items:center;gap:8px;color:#9C5530;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;margin-top:22px}

<script src="assets/vendor/vivus/vivus.min.js"></script>
<script>
(function(){
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STEPS = [
    {ids:['D1','D2','D3'], title:'One student. Three doors.', lead:'Every stylist arrives one of three ways — the site, a workshop, or her chair.'},
    {ids:['T1','N1','N2','N3','N4','N5','N6'], draw:true, title:'Where she goes today.', lead:'Six stages — all of it manual, all of it in Miko’s head.'},
    {ids:['K1','K2','K3'], title:'Where she falls out.', lead:'Three leaks — interest with nowhere to go, momentum that dies, students nobody remembers.'},
    {ids:['L1','C1'], dim:1, title:'The website catches her.', lead:'A door that never closes — the score captures every arrival.'},
    {ids:['L2','C2'], dim:2, title:'The curriculum carries her.', lead:'The workshop no longer ends the relationship — it starts it.'},
    {ids:['L3','C3','LP'], dim:3, title:'The system remembers her.', lead:'Nobody stalls unseen — and every graduate feeds the next workshop.'},
  ];
  var step = -1, v = null;
  var title = document.getElementById('jtitle');
  var lead = document.getElementById('jlead');
  var ind = document.getElementById('jstep');

  function apply(i){
    STEPS.slice(0, i+1).forEach(function(s){
      s.ids.forEach(function(id){ document.getElementById(id).classList.add('on'); });
      if(s.dim) document.body.dataset['dim'+s.dim] = '1';
    });
    var s = STEPS[i];
    title.textContent = s.title; lead.textContent = s.lead;
    ind.innerHTML = '<b>' + (i+1) + ' / ' + STEPS.length + '</b> — ' + (i+1 < STEPS.length ? 'space or tap → next' : 'the whole picture');
    if(s.draw && window.Vivus && !reduced && !v){
      v = new Vivus('jdraw',{duration:110,type:'scenario',animTimingFunction:Vivus.EASE});
    }
  }
  function unapply(i){
    var s = STEPS[i];
    s.ids.forEach(function(id){ document.getElementById(id).classList.remove('on'); });
    if(s.dim) delete document.body.dataset['dim'+s.dim];
    var p = STEPS[i-1] || {title:'One student. Three doors.',lead:''};
    title.textContent = p.title; lead.textContent = p.lead || '';
    ind.innerHTML = '<b>' + i + ' / ' + STEPS.length + '</b> — space or tap → next';
  }
  function next(){ if(step < STEPS.length-1){ step++; apply(step); } }
  function prev(){ if(step > 0){ unapply(step); step--; } }
  if(reduced){ step = STEPS.length-1; apply(step); return; }
  document.addEventListener('keydown', function(e){
    if(e.code==='Space'||e.code==='ArrowRight'){ e.preventDefault(); next(); }
    if(e.code==='ArrowLeft'){ e.preventDefault(); prev(); }
  });
  document.querySelector('.jmap').addEventListener('click', next);
  next();
})();
</script>
