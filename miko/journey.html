<script src="assets/vendor/vivus/vivus.min.js"></script>
<script>
(function(){
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STEPS = [
    {view:'V1', lane:'lanePathA', title:'The chair is the door.',
      lead:'A client asks — Miko mentions the workshop — she attends. Then the path ends. No follow-up exists.'},
    {view:'V2', lane:'lanePathB', title:'Word of mouth is the only engine.',
      lead:'An attendee tells a friend. If the friend can find her — same path, same ending.'},
    {view:'V3', lane:'lanePathC', title:'+ A website makes her findable.',
      lead:'A stranger searches, takes the score, sees where she stands — and arrives warm, day or night.'},
    {view:'V4', lane:'lanePathD', title:'+ The course keeps her.',
      lead:'The workshop stops being the end — it becomes the on-ramp. The third income stream.'},
    {view:'V5', title:'+ The CRM remembers everyone.',
      lead:'Every student on every path is known — and graduates bring friends back to any door.'},
  ];
  var step = -1, viv = {};
  var title = document.getElementById('jtitle');
  var lead = document.getElementById('jlead');
  var ind = document.getElementById('jstep');
  var views = STEPS.map(function(s){ return document.getElementById(s.view); });

  function draw(view){
    var id = view.id + '-draw';
    if(viv[view.id] || reduced || !window.Vivus || !document.getElementById(id)) return;
    viv[view.id] = new Vivus(id,{duration:70,type:'scenario',animTimingFunction:Vivus.EASE});
  }

  function apply(i){
    views.forEach(function(el,idx){ el.classList.toggle('on', idx===i); });
    var s = STEPS[i];
    title.textContent = s.title; lead.textContent = s.lead;
    ind.innerHTML = '<b>' + (i+1) + ' / ' + STEPS.length + '</b> — ' +
      (i+1 < STEPS.length ? 'space or tap → next path' : 'the whole picture');
    draw(views[i]);
  }
  function next(){ if(step < STEPS.length-1){ step++; apply(step); } }
  function prev(){ if(step > 0){ step--; apply(step); } }
  if(reduced){ step = STEPS.length-1; apply(step); return; }
  document.addEventListener('keydown', function(e){
    if(e.code==='Space'||e.code==='ArrowRight'){ e.preventDefault(); next(); }
    if(e.code==='ArrowLeft'){ e.preventDefault(); prev(); }
  });
  document.querySelectorAll('.jmap').forEach(function(m){ m.addEventListener('click', next); });
  next();
})();
</script>
